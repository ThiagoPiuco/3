<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revenda</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h3>Cadastre seu veículo para vender mais rápido</h3>
        </div>
        <div class="form-container">
        <div class="form-header">
            <p>Formulário</p>
        </div>
            <div class="form-body">
                <h1 class="form-titulo">Venda fácil seu carro</h1>
                <p>Descreva as caracteristicas e escrevas os opcionais que seu carro possue</p>
                <form>
                <div class="box-input">
                    <label for="title">Título do anúncio <span class="required-field">*</span></label>
                    <input type="text" name="title" id="title" class="block" placeholder="Um título para seu anúncio"
                    minlength="1"
                    maxlength="30"
                    required>
                </div>
                <div class="box-input">
                    <label for="price">Preço <span class="required-field">*</span></label>
                    <input type="number" name="price" id="price" class="block" placeholder="Defina o preço"
                    required>
                </div>
                <div class="box-input">
                    <label for="description">Descrição<span class="required-field">*</span></label>
                    <textarea name="description" id="description" class="block" placeholder="Detalhes do seu veículos, como marcas e arranhões"></textarea>
                </div>
                 <div class="box-input">
                    <label for="brand">Marca do carro <span class="required-field">*</span></label>
                    <input type="text" name="brand" id="brand" class="block" placeholder="Digite a marca do carro"
                    
                    required>
                </div>
                <div class="box-input">
                    <label for="model">Modelo do carro <span class="required-field">*</span></label>
                    <input type="text" name="model" id="model" class="block" placeholder="Digite o modelo do carro"
                    
                    required>
                </div>
                <div class="box-input">
                    <label for="mileage">Kilometragem<span class="required-field">*</span></label>
                    <input type="number" name="mileage" id="mileage" class="block" placeholder="Digite a kilometragem do carro"
                    
                    required>
                </div>
                <div class="box-input">
                    <label for="purchase_date">Data de compra<span class="required-field">*</span></label>
                    <input type="date" name="purchase_date" id="purchase_date" class="block" 
                    
                    required>
                </div>

                <div class="box-input">
                    <p>Tipo de câmbio <span class="required-field">*</span></p>
                    <input type="radio" name="gear" id="manual">
                    <label for="manual">Manual</label>
                    <input type="radio" name="gear" id="automatico">
                    <label for="automatico">Automático</label>
                </div>
                <div class="optional-box">
                    <p>Opcionais</p>
                    <ul class="optional-list">
                        <li> <input type="checkbox" id="airbag" name="optional[]" value="airbag">
                        <label for="airbag">Airbag</label></li>

                        <li> <input type="checkbox" id="alarme" name="optional[]" value="alarme">
                        <label for="alarme">Alarme</label></li>

                        <li> <input type="checkbox" id="ac" name="optional[]" value="ac">
                        <label for="ac">Ar-Condicionado</label>
                        </li>

                        <li> <input type="checkbox" id="reverse_camera" name="optional[]" value="reverse_camera">
                        <label for="reverse_camera">Camera de ré</label>
                        </li>
                    </ul>
                </div>
                <div class="optional-box">

                    <ul class="optional-list">
                        <li> <input type="checkbox" id="lane-assistent" name="optional[]" value="lane-assistent">
                        <label for="lane-assistent">Assistente de pista</label></li>

                        <li> <input type="checkbox" id="keyless" name="optional[]" value="keyless">
                        <label for="keyless">Partida Keyless</label></li>

                        <li> <input type="checkbox" id="smartphone" name="optional[]" value="smartphone">
                        <label for="smartphone">Integração com o celular</label>
                        </li>

                        <li> <input type="checkbox" id="leather_seat name="optional[]" value="leather_seat">
                        <label for="leather_seat">Banco de couro</label>
                        </li>
                    </ul>
                </div>
                <div class="box-input">
                    <p>Fotos do veículo<span class="required-field">*</span></p>
                    <input type="file" multiple accept="image/pgn, image/jpg" id="images" name="images" required>
                </div>
                <input type="submit" value="Enviar" class="btn-submit">
                </form>
            </div>
        </div>
    </div>
</body>
</html>
